[package]
name = "fullme"
version = "0.1.0"
edition = "2021"
description = "右上角 240x120 多页签小浏览器命令行工具"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable feature: 多 webview（一个窗口内 add_child 子页签）
tauri = { version = "2", features = ["unstable"] }
# 单实例：重复执行 fullme 时把参数转发给已运行的实例
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# 守护化（fork/setsid/dup2）：GUI 跑子进程，调用方立即返回
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Windows：spawn 前取消本进程 stdio 继承标志（防止调用方管道被守护进程拖住）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
